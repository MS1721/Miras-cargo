<!DOCTYPE html>
<html lang="mn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mira's Cargo Admin</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

    <h1>Mira's Cargo Admin</h1>

    <div class="login-box">

        <h2>🔐 Admin Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Нэвтрэх нэр">

        <input
            type="password"
            id="password"
            placeholder="Нууц үг">

        <button onclick="login()">
            Нэвтрэх
        </button>

        <p id="loginError"></p>

    </div>

</div>


<!-- ADMIN -->

<div id="adminPage" style="display:none;">

<header>

    <h1>📦 Mira's Cargo Admin</h1>

    <button onclick="logout()">
        Гарах
    </button>

</header>


<!-- ШИНЭ АЧАА -->

<section class="card">

<h2>📦 Шинэ ачаа нэмэх</h2>

<input
    type="date"
    id="date">

<input
    type="text"
    id="phone"
    placeholder="Утасны дугаар">

<input
    type="text"
    id="track"
    placeholder="Track code">

<input
    type="number"
    id="price"
    placeholder="Үнэ">

<button onclick="addCargo()">
    ➕ Ачаа нэмэх
</button>

</section>


<!-- BULK -->

<section class="card">

<h2>📋 Олон ачаа нэг дор оруулах</h2>

<textarea
    id="bulkData"
    rows="12"
    placeholder="94791721 123456789 2000
94791721 234567890 3000
94791721 345678901 5000"></textarea>

<button onclick="previewBulk()">
    👀 Урьдчилж харах
</button>

<button onclick="saveBulk()">
    💾 Бүгдийг хадгалах
</button>

<div id="previewTable"></div>

</section>


<!-- TRACK ХАЙХ -->

<section class="card">

<h2>🔍 Track code хайх</h2>

<input
    type="text"
    id="searchTrack"
    placeholder="Track code">

<button onclick="searchTrack()">
    🔎 Хайх
</button>

<div id="searchResult"></div>

</section>


<!-- ТАЙЛАН -->

<section class="card">

<h2>📊 Нийт тайлан</h2>

<p>
📦 Нийт ачаа:
<b id="totalCargo">0</b>
</p>

<p>
💰 Нийт орлого:
<b id="totalIncome">0₮</b>
</p>

</section>


<!-- ХАДГАЛСАН АЧАА -->

<section class="card">

<h2>📂 Хадгалсан ачаанууд</h2>

<div style="overflow-x:auto;">

<table>

<thead>

<tr>
<th>Огноо</th>
<th>Утас</th>
<th>Track</th>
<th>Үнэ</th>
<th>Үйлдэл</th>
</tr>

</thead>

<tbody id="cargoTable"></tbody>

</table>

</div>

</section>

</div>


<!-- SCRIPT -->

<script src="script.js"></script>

</body>
</html>
