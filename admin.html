<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mira's Cargo Admin</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.header{
    background:#111;
    color:white;
    text-align:center;
    padding:25px;
}

.box{
    background:white;
    width:90%;
    max-width:450px;
    margin:20px auto;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px #ccc;
}

input,button{
    width:100%;
    padding:12px;
    margin:8px 0;
    box-sizing:border-box;
    font-size:16px;
    border-radius:8px;
}

input{
    border:1px solid #ccc;
}

button{
    background:#111;
    color:white;
    border:0;
}

#msg{
    text-align:center;
}
</style>

</head>

<body>

<div class="header">
<h1>🚚 Mira's Cargo Admin</h1>
<p>Ачаа нэмэх хэсэг</p>
</div>


<div class="box">

<h2>📦 Ачаа нэмэх</h2>

<input id="phone" placeholder="Утасны дугаар">

<input id="track" placeholder="Track code">

<input id="price" placeholder="Үнэ">

<label>📅 Огноо</label>
<input type="date" id="date">


<button onclick="addCargo()">
Нэмэх
</button>

<p id="msg"></p>

</div>


<script type="module">

// ЭНД FIREBASE CONFIG ОРНО
import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getDatabase, ref, push, set } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
databaseURL: "YOUR_DATABASE_URL",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_STORAGE_BUCKET",
messagingSenderId: "YOUR_SENDER_ID",
appId: "YOUR_APP_ID"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);



window.addCargo = function(){

let phone=document.getElementById("phone").value;
let track=document.getElementById("track").value;
let price=document.getElementById("price").value;
let date=document.getElementById("date").value;


let newCargo = push(ref(db,"cargo"));


set(newCargo,{

phone:phone,
track:track,
price:price,
date:date

});


document.getElementById("msg").innerHTML=
"✅ Амжилттай нэмэгдлээ";


};


</script>


</body>
</html>
