<!DOCTYPE html>
<html lang="mn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mira's Cargo Admin</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.header{
    background:#111;
    color:white;
    text-align:center;
    padding:25px;
}

.box{
    background:white;
    width:90%;
    max-width:600px;
    margin:20px auto;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px #ccc;
}

input, textarea, button{
    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
    font-size:16px;
}

textarea{
    height:250px;
}

button{
    background:#111;
    color:white;
    border:0;
    border-radius:8px;
}

.info{
    background:#eee;
    padding:10px;
    border-radius:8px;
}

</style>

</head>

<body>


<div class="header">

<h1>🚚 Mira's Cargo Admin</h1>

<p>Олон ачаа нэг дор нэмэх</p>

</div>



<div class="box">

<h2>📅 Огноо сонгох</h2>

<input type="date" id="date">



<h2>📦 Ачааны мэдээлэл</h2>

<div class="info">

Формат:

<br>

Track code, Утасны дугаар, Үнэ

<br><br>

Жишээ:

<br>

9818243600082,94791721,3500

<br>

9818243600083,94792222,5000

</div>


<textarea id="cargoText" placeholder="Track code,Утас,Үнэ"></textarea>



<button onclick="addCargo()">

✅ Бүгдийг нэмэх

</button>


<p id="msg"></p>


</div>




<script>


function addCargo(){


let date =
document.getElementById("date").value;


let text =
document.getElementById("cargoText").value;



if(!date){

alert("Огноо сонгоно уу");

return;

}


if(!text){

alert("Ачааны мэдээлэл оруулна уу");

return;

}



let cargo =
JSON.parse(localStorage.getItem("cargo")) || [];



let rows =
text.trim().split("\n");



let count=0;



rows.forEach(row=>{


let data =
row.split(",");



if(data.length==3){


let track =
data[0].trim();


let phone =
data[1].trim();


let price =
data[2].trim();



cargo.push({

track:track,

phone:phone,

price:price,

date:date

});


count++;

}


});



localStorage.setItem(
"cargo",
JSON.stringify(cargo)
);



document.getElementById("msg").innerHTML =
"✅ "+count+" ширхэг ачаа нэмэгдлээ";


document.getElementById("cargoText").value="";


}



</script>


</body>
</html>
