<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mira's Cargo Admin</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

</head>
<body>

<div id="loginPage">

<h1>Mira's Cargo Admin</h1>

<div class="login-box">

<h2>Admin Login</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<p id="loginError"></p>

</div>

</div>

<div id="adminPage" style="display:none;">

<header>

<h1>Mira's Cargo Admin Panel</h1>

<button onclick="logout()">
Logout
</button>

</header>

<section class="card">

<h2>📦 Шинэ ачаа нэмэх</h2>

<input
type="date"
id="date">

<input
type="text"
id="phone"
placeholder="Утасны дугаар">

<input
type="text"
id="track"
placeholder="Track code">

<input
type="number"
id="price"
placeholder="Үнэ">

<button onclick="addCargo()">
➕ Нэмэх
</button>

</section>

<section class="card">

<h2>📋 Bulk Paste</h2>

<textarea
id="bulkData"
rows="10"
placeholder="94791721 27352836 9000"></textarea>

<button onclick="previewBulk()">
Preview
</button>

<button onclick="saveBulk()">
Save
</button>

<div id="previewTable"></div>

</section>
<section class="card">

<h2>🔍 Track code хайх</h2>

<input
type="text"
id="searchTrack"
placeholder="Track code">

<button onclick="searchTrack()">
Хайх
</button>

<div id="searchResult"></div>

</section>

<section class="card">

<h2>📊 Өдрийн тайлан</h2>

<div class="report">

<p>
📦 Нийт ачаа:
<span id="totalCargo">0</span>
</p>

<p>
💰 Нийт орлого:
<span id="totalIncome">0₮</span>
</p>

</div>

</section>

<section class="card">

<h2>📂 Хадгалсан ачаанууд</h2>

<table>

<thead>

<tr>

<th>Огноо</th>

<th>Утас</th>

<th>Track</th>

<th>Үнэ</th>

<th>Үйлдэл</th>

</tr>

</thead>

<tbody id="cargoTable">

</tbody>

</table>

</section>

</div>

<script src="script.js"></script>

</body>
</html
