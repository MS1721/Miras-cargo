
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mira's Cargo</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
}

header{
    background:#111;
    color:white;
    padding:25px;
    text-align:center;
}

.container{
    width:90%;
    max-width:500px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px #ccc;
}

input, button{
    width:100%;
    padding:12px;
    margin-top:10px;
    font-size:16px;
    border-radius:8px;
}

input{
    border:1px solid #ccc;
}

button{
    background:#111;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#333;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#eee;
    border-radius:10px;
}
</style>

</head>

<body>

<header>
<h1>Mira's A&Z Cargo</h1>
<p>Ховд аймаг • Булган сум</p>
</header>


<div class="container">

<h2>Бараа шалгах</h2>

<input id="code" placeholder="Трак кодоо оруулна уу">

<button onclick="checkCargo()">Шалгах</button>

<div class="result" id="result">
Барааны мэдээлэл энд гарна
</div>

</div>


<script>

function checkCargo(){

let code = document.getElementById("code").value;

let result = document.getElementById("result");


if(code=="MIRA001"){

result.innerHTML =
"✅ Бараа: Гар цүнх<br>"+
"📦 Төлөв: Монголд ирсэн<br>"+
"💰 Төлбөр: 15,000₮";

}

else if(code=="MIRA002"){

result.innerHTML =
"✅ Бараа: Хувцас<br>"+
"📦 Төлөв: Замд явж байна<br>"+
"💰 Төлбөр: 20,000₮";

}

else{

result.innerHTML =
"❌ Ийм трак код олдсонгүй";

}

}

</script>


</body>
</html>
